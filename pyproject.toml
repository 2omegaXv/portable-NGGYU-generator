[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nggyu"
version = "0.1.0"
description = "Frame-index lookup for the NGGYU overfit model"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "diffusers==0.32.2", "Pillow>=9"]

[tool.setuptools]
packages = ["nggyu"]
